name: Build

# One compile run per push (every commit that lands on any branch gets its own run, named by its short SHA) and per
# pull request. It exports the debug builds for Linux, Windows, macOS (Intel and Apple Silicon as two separate builds)
# and Web, and uploads each as a single downloadable workflow artifact named
# KyttusLab-<platform>-Debug-<label>-<short sha>.<ext>, where <label> is the branch or "pr-<n>" for pull requests.
# Linux downloads need `chmod +x` (GitHub does not keep file modes). macOS builds are ad-hoc signed, not notarized:
# right-click the app and choose Open the first time.
#
# Staging release: every push to main also replaces the files of the ONE GitHub release tagged `staging` (a
# prerelease) with that commit's builds, under fixed names (KyttusLab-<platform>-Debug.<ext>). The release and its tag
# are created once, the first time; after that the tag is moved to the new commit and the files are overwritten, so no
# new tags or releases pile up. Artifacts expire on their own (14 days on main, 5 on other branches). Version names are
# never edited here.
#
# Godot and the export templates are pinned in ONE place: GODOT_VERSION in tools/build/setup_godot.sh.
# Godot's macOS export templates only contain universal binaries, so macOS is exported once as universal on Linux and
# then cut down to x86_64 and arm64 on a macOS runner (tools/macos/thin_app.sh: lipo -thin, then an ad-hoc signature).
# Android / Quest / iOS / SteamVR / 32-bit Windows presets need extra SDKs or keys and are not built here.
#
# The headless test job imports with that same pin and runs a fast suite subset plus `npm test`.
# Timing suites stay out of that job.

run-name: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.number) || github.ref_name }} @ ${{ github.sha }}"

on:
  push:
  pull_request:
  workflow_dispatch:

# Never cancel a run for an older commit: each commit keeps its own compile result.
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  LASTROUTE_BUILD_REVISION: ${{ github.sha }}
  # the one release every main build overwrites
  STAGING_TAG: staging
  STAGING: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  export:
    name: ${{ matrix.name }} (${{ github.sha }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            preset: Linux Debug Tools
            output: KyttusLab-Linux-Debug.x86_64
          - name: Windows
            preset: Windows Debug Tools
            output: KyttusLab-Windows-Debug.exe
          # universal here; the macos job below turns it into the Intel and Apple Silicon builds
          - name: macOS
            preset: macOS Debug Tools
            output: KyttusLab-macOS-Debug.zip
          - name: Web
            preset: Web Debug Tools
            output: web/index.html
    steps:
      - uses: actions/checkout@v4
        with:
          # the build number is the commit count up to this revision (tools/build/generate_build_revision.mjs)
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read pinned Godot version
        id: pin
        run: echo "version=$(sed -n 's/^GODOT_VERSION="\${GODOT_VERSION:-\(.*\)}"/\1/p' tools/build/setup_godot.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot
          key: godot-${{ steps.pin.outputs.version }}-${{ runner.os }}

      - name: Install Godot and export templates
        run: tools/build/setup_godot.sh --templates

      - name: Cache Godot import data
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ steps.pin.outputs.version }}-${{ hashFiles('project.godot', '**/*.import') }}
          restore-keys: godot-import-${{ steps.pin.outputs.version }}-

      - name: Import project
        run: ~/.local/bin/godot4 --headless --path . --import || true

      - name: Stamp build revision
        run: node tools/build/generate_build_revision.mjs

      - name: Export ${{ matrix.preset }}
        run: |
          set -euo pipefail
          out="build/${{ matrix.output }}"
          mkdir -p "$(dirname "$out")"
          ~/.local/bin/godot4 --headless --path . --export-debug "${{ matrix.preset }}" "$PWD/$out" 2>&1 | tee export.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR: Failed to export|Export failed|ERROR: Project export' export.log; then
            echo "::error::export of ${{ matrix.preset }} reported errors"
            exit 1
          fi
          test -e "$out"

      - name: Pre-compress web build
        if: matrix.name == 'Web'
        run: |
          rm -f build/web/*.import build/web/*.uid
          node tools/build/compress_web.mjs build/web

      # The universal macOS zip goes to the macos job, which thins, signs, uploads and releases it.
      - name: Hand the universal macOS build to the macos job
        if: matrix.name == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: build/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 1

      # Every artifact is ONE file uploaded as-is (archive: false), so a download is the runnable itself, not a zip of it.
      # The web build is many files, so it is one zip you unpack and serve.
      - name: Name the file after the branch and commit
        if: matrix.name != 'macOS'
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then label="pr-${{ github.event.number }}"
          else label="$(printf '%s' "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._-' '-')"; fi
          mkdir -p dist release
          case "${{ matrix.name }}" in
            Web)
              (cd build && zip -qr "../release/KyttusLab-Web-Debug.zip" web)
              cp release/KyttusLab-Web-Debug.zip "dist/KyttusLab-Web-Debug-${label}-${short}.zip"
              ;;
            *)
              file="${{ matrix.output }}"
              base="${file%.*}"; ext="${file##*.}"
              cp "build/${file}" "release/${file}"
              cp "build/${file}" "dist/${base}-${label}-${short}.${ext}"
              ;;
          esac
          ls -la dist release

      - uses: actions/upload-artifact@v7
        if: matrix.name != 'macOS'
        with:
          path: dist/*
          archive: false
          if-no-files-found: error
          retention-days: ${{ github.ref_name == 'main' && 14 || 5 }}

      - name: Hand the build to the staging release job
        if: matrix.name != 'macOS' && env.STAGING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: staging-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          retention-days: 1

  macos:
    name: macOS ${{ matrix.label }} (${{ github.sha }})
    needs: export
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Intel
            arch: x86_64
            output: KyttusLab-macOS-Intel-Debug.zip
          - label: Apple Silicon
            arch: arm64
            output: KyttusLab-macOS-AppleSilicon-Debug.zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: macos-universal
          path: universal

      - name: Thin to ${{ matrix.arch }} and sign ad hoc
        run: |
          set -euo pipefail
          mkdir -p release dist
          tools/macos/thin_app.sh universal/KyttusLab-macOS-Debug.zip "${{ matrix.arch }}" "release/${{ matrix.output }}"
          short="${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then label="pr-${{ github.event.number }}"
          else label="$(printf '%s' "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._-' '-')"; fi
          file="${{ matrix.output }}"
          cp "release/${file}" "dist/${file%.zip}-${label}-${short}.zip"
          ls -la dist release

      - uses: actions/upload-artifact@v7
        with:
          path: dist/*
          archive: false
          if-no-files-found: error
          retention-days: ${{ github.ref_name == 'main' && 14 || 5 }}

      - name: Hand the build to the staging release job
        if: env.STAGING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: staging-macos-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 1

  # After every build has finished: upload all of this commit's files to the staging release in one place (so the
  # release never mixes two commits), move the staging tag here and rewrite the notes. Runs even when one platform
  # failed: that platform keeps its previous file and the notes say so.
  staging-release:
    name: Staging release
    needs: [export, macos]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # two main pushes in a row finish one after the other, oldest first
    concurrency:
      group: staging-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: staging-*
          merge-multiple: true
          path: release

      - name: Replace the staging release files with this commit's builds
        env:
          GH_TOKEN: ${{ github.token }}
          EXPORT_RESULT: ${{ needs.export.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: tools/build/staging_release.sh release/*

  # Fast gate on every push and pull request. Same Godot pin and import as export, without templates
  # (this job does not export). The editor cache key is separate so a save here cannot replace the
  # export job's cache, which also holds the export templates. The .godot import cache key matches
  # export so a warm import is shared. Timing suites stay off this list: stream_perf, prop_perf,
  # idle_stability, quality_tiers, lods measure frame time and flake when they share a machine.
  test:
    name: Headless tests (${{ github.sha }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI_FAST_SUITES: platform room player layout data_props data_packs no_invisible hiding_props
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend tests
        run: npm test

      - name: Read pinned Godot version
        id: pin
        run: echo "version=$(sed -n 's/^GODOT_VERSION="\${GODOT_VERSION:-\(.*\)}"/\1/p' tools/build/setup_godot.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache Godot editor
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/${{ steps.pin.outputs.version }}
          key: godot-editor-${{ steps.pin.outputs.version }}-${{ runner.os }}

      - name: Install Godot
        run: tools/build/setup_godot.sh

      - name: Cache Godot import data
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ steps.pin.outputs.version }}-${{ hashFiles('project.godot', '**/*.import') }}
          restore-keys: godot-import-${{ steps.pin.outputs.version }}-

      - name: Import project
        run: ~/.local/bin/godot4 --headless --path . --import || true

      - name: Fast validation suites
        run: |
          set -euo pipefail
          read -r -a suites <<< "$CI_FAST_SUITES"
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "::error::CI_FAST_SUITES is empty; refusing to run every suite"
            exit 1
          fi
          for name in "${suites[@]}"; do
            case "$name" in
              stream_perf|prop_perf|idle_stability|quality_tiers|lods)
                echo "::error::timing suite ${name} stays out of the fast CI job"
                exit 1
                ;;
            esac
          done
          export GODOT_BIN="$HOME/.local/bin/godot4"
          set +e
          python3 tools/build/run_suites.py --jobs 4 "${suites[@]}" | tee suites.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Fast suites"
            echo
            echo '```'
            awk '/^==== SUMMARY/,/^RESULT:/' suites.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  summary:
    name: Build summary
    needs: [export, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "### ${GITHUB_SHA::7}: exports ${{ needs.export.result }}, macOS ${{ needs.macos.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifacts are attached to this run and expire on their own. Pushes to main also refresh the staging release." >> "$GITHUB_STEP_SUMMARY"
      - if: needs.export.result != 'success' || needs.macos.result != 'success'
        run: exit 1
