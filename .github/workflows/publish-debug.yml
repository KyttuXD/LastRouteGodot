name: Publish debug builds

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: last-route-debug-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.1
  GODOT_STATUS: stable
  GODOT_LINUX_SHA256: c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba
  GODOT_TEMPLATES_SHA256: 86409db6200b6f8fd3230989c2d2002851f3dd18acf11d7bdbafddf5a0dd0f72

jobs:
  publish-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          release="${GODOT_VERSION}-${GODOT_STATUS}"
          base="https://github.com/godotengine/godot/releases/download/${release}"
          editor="Godot_v${release}_linux.x86_64.zip"
          templates="Godot_v${release}_export_templates.tpz"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${editor}" "${base}/${editor}"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${templates}" "${base}/${templates}"
          printf '%s  %s\n' "${GODOT_LINUX_SHA256}" "${RUNNER_TEMP}/${editor}" | sha256sum --check
          printf '%s  %s\n' "${GODOT_TEMPLATES_SHA256}" "${RUNNER_TEMP}/${templates}" | sha256sum --check
          unzip -q "${RUNNER_TEMP}/${editor}" -d "${RUNNER_TEMP}/godot"
          sudo install -m 0755 "${RUNNER_TEMP}/godot/Godot_v${release}_linux.x86_64" /usr/local/bin/godot4
          template_root="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "${template_root}" "${RUNNER_TEMP}/godot-templates"
          unzip -q "${RUNNER_TEMP}/${templates}" -d "${RUNNER_TEMP}/godot-templates"
          cp -R "${RUNNER_TEMP}/godot-templates/templates/." "${template_root}/"
          godot4 --version

      - name: Run backend tests
        run: npm test

      - name: Import Godot project
        # A fresh runner has no `.godot/global_script_class_cache.cfg` yet.
        # Opening the editor once registers every `class_name` and imports the
        # GLBs before either validation or export tries to compile autoloads.
        run: godot4 --headless --editor --quit --path .

      - name: Run complete Godot validation
        run: godot4 --headless --path . res://scenes/validate.tscn

      - name: Export debug builds
        run: ./scripts/export_test_builds.sh

      - name: Verify build archives
        shell: bash
        run: |
          set -euo pipefail
          for archive in \
            builds/LastRoute-Linux-Debug.zip \
            builds/LastRoute-Windows-Debug.zip \
            builds/LastRoute-Windows-SteamVR-Debug.zip \
            builds/LastRoute-macOS-Debug.zip \
            builds/LastRoute-Web-Debug.zip; do
            unzip -tq "${archive}"
          done
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("builds/updates.debug.json", "utf8"));
            const revisions = new Set(Object.values(manifest.debug).map(entry => entry.revision));
            if (revisions.size !== 1 || !revisions.has(process.env.GITHUB_SHA)) {
              throw new Error(`manifest revision does not match ${process.env.GITHUB_SHA}`);
            }
          '

      - name: Replace debug release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload debug --repo "${GITHUB_REPOSITORY}" --clobber \
            builds/LastRoute-Linux-Debug.zip \
            builds/LastRoute-Windows-Debug.zip \
            builds/LastRoute-Windows-SteamVR-Debug.zip \
            builds/LastRoute-macOS-Debug.zip \
            builds/LastRoute-Web-Debug.zip

      - name: Publish update manifest last
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload debug --repo "${GITHUB_REPOSITORY}" --clobber builds/updates.debug.json
