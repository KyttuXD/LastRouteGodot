<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Last Route (Godot 2): an purple route line (Kathy's purple) running to a lit teal relay node.
       Shape of the 2D game's icon, recoloured to the Godot 2 palette (game/config/palette.gd). -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1220"/>
      <stop offset="1" stop-color="#150d16"/>
    </linearGradient>
    <radialGradient id="glow" cx="43" cy="17" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#37b9b0" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#37b9b0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect x="2" y="2" width="60" height="60" rx="14"/></clipPath>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#ground)"/>
  <g clip-path="url(#tile)"><circle cx="43" cy="17" r="24" fill="url(#glow)"/></g>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="#8a6396" stroke-width="3"/>
  <path d="M13 50H27V33H43V20" fill="none" stroke="#b48ec0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="13" cy="50" r="4" fill="#b48ec0"/>
  <circle cx="43" cy="17" r="10" fill="#37b9b0" stroke="#b48ec0" stroke-width="3.5"/>
  <circle cx="43" cy="17" r="4.2" fill="#bff5ec"/>
</svg>
